name: SonarCloud
on: 
  workflow_dispatch:
  # Feature branches are analyzed via the pull_request event (below), so they are
  # intentionally NOT listed here: otherwise every push to a branch with an open PR
  # would run SonarCloud twice for the same commit. Push analysis is kept for the
  # long-lived integration branches.
  push:
    branches:
      - master
      - develop
      - hotfix/*
      - release/*
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # 8.0.x runs the .NET tools (dotnet-gitversion, dotnet-sonarscanner target net8.0);
      # 10.0.x builds the solution under analysis.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          AZURE_CLIENT_ID:  ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:  ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:  ${{ secrets.AZURE_TENANT_ID }}
        shell: powershell
        # No ${{ }} expansion inside this run block: even in comments, expressions are
        # expanded before the shell runs, which would leak secrets into the script text.
        run: |
          dotnet --version
          dotnet tool restore
          .\sonarcloud.ps1 -sonarSecret $env:SONAR_TOKEN
